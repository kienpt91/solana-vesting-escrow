name: release

# A push of a tag v* verifies the code, packages the source, writes SHA256SUMS, attests where the files came from and
# creates the GitHub release. workflow_dispatch only builds and keeps the files as a workflow artifact; it never creates
# a release. Nothing is published to a package registry. The program is not released as a binary: the SBF toolchain is
# not part of this repository's tooling (README, "What the tests execute"), so the artefact is the source.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag must name the manifest version and be in the history of the default branch
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: sh scripts/check-release-tag.sh "$TAG"
      - name: Shell tests of the scripts
        run: sh scripts/test-release.sh && sh scripts/test-demo.sh && sh scripts/test-rs.sh && sh scripts/test-secret-scan.sh && sh scripts/test-lock.sh && sh scripts/check-lock.sh
      - name: Secret scan and hygiene
        run: sh scripts/secret-scan.sh --tree && sh scripts/secret-scan.sh --history && sh scripts/hygiene.sh --tree && sh scripts/hygiene.sh --history
      - run: sh scripts/rs.sh --net 'rustup component add clippy rustfmt'
      - run: sh scripts/rs.sh --net 'cargo fetch --locked'
      - run: sh scripts/rs.sh 'cargo fmt --all -- --check'
      - run: sh scripts/rs.sh 'cargo clippy --workspace --all-targets --locked --offline -- -D warnings'
      - run: sh scripts/rs.sh 'sh scripts/test-layers.sh'
      - run: sh scripts/rs.sh 'cargo build -p vesting_escrow --release --locked --offline'

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Package the source of the tagged commit and checksum it
        run: |
          version=$(sh scripts/manifest-version.sh)
          dir=solana-vesting-escrow-$version
          mkdir -p release
          # git archive output is a function of the commit only: same commit, same bytes
          git archive --format=tar --prefix="$dir/" HEAD | gzip -n > "release/$dir-source.tar.gz"
          cd release
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Attest the build provenance of the files
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Create the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sh scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/release-notes.txt"
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.txt" $flags release/*
      - name: Keep the build (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build
          path: release/*
          if-no-files-found: error
          retention-days: 7
