[package]
name = "vesting_tests"
description = "In-process test harness and the test suites of the vesting escrow program"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
vesting_core = { path = "../vesting_core" }
vesting_escrow = { path = "../../programs/vesting_escrow", features = ["no-entrypoint"] }
vesting_client = { path = "../vesting_client" }
solana-program = "=1.18.26"
solana-program-test = "=1.18.26"
solana-sdk = "=1.18.26"
spl-token = { version = "=4.0.0", features = ["no-entrypoint"] }
# the request context of the in-process bank (a longer deadline, see Env::patient); already in the lock file through solana-program-test
tarpc = { version = "=0.29.0", default-features = false }
tokio = { version = "=1.51.6", features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"
